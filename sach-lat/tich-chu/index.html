    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #ee5253;
            --accent: #feca57;
            --bg-color: #121420;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --panel-border: rgba(255, 255, 255, 0.16);
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            height: 54px;
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.35);
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 48vw;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Main Flipbook Stage */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .flipbook-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #flipbook-wrapper {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 8px 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #flipbook {
            position: relative;
        }

        #flipbook .page {
            background-color: #000;
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Nav Side Arrows */
        .nav-side-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(18, 20, 32, 0.7);
            border: 1px solid var(--panel-border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 80;
            backdrop-filter: blur(6px);
            transition: all 0.2s;
        }

        .nav-side-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-side-btn.disabled {
            opacity: 0.2;
            pointer-events: none;
        }

        .nav-prev { left: 16px; }
        .nav-next { right: 16px; }

        /* Bottom Floating Dock */
        .bottom-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(14px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 90;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #e0e0e0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.1);
        }

        .ctrl-btn.active {
            color: var(--accent);
        }

        .ctrl-btn.disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        .page-badge {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .separator {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }

        /* Thumbnails Drawer */
        .thumb-drawer {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(18, 20, 32, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px 16px;
            display: none;
            gap: 10px;
            overflow-x: auto;
            max-width: 90vw;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            z-index: 95;
            opacity: 0;
            transition: all 0.25s ease-out;
        }

        .thumb-drawer.show {
            display: flex;
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .thumb-item {
            flex: 0 0 88px;
            height: 50px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .thumb-item:hover, .thumb-item.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-label {
            position: absolute;
            bottom: 2px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        
        /* Rotate Hint */
        .rotate-hint {
            display: none;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.95), rgba(254, 202, 87, 0.95));
            color: #111;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 150;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        .rotate-hint button {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            line-height: 1;
            padding: 0 2px;
        }

        @media (max-width: 600px) and (orientation: portrait) {
            .rotate-hint {
                display: flex;
            }
            .nav-side-btn {
                display: none; /* Hide overlay buttons on small mobile portrait so they don't cover artwork */
            }
            .header-title {
                display: none; /* Hide truncated title on small mobile, keep brand badge clear */
            }
            .brand-badge {
                font-size: 13px;
                padding: 4px 12px;
            }
            .bottom-bar {
                gap: 8px;
                padding: 6px 14px;
            }
            .ctrl-btn {
                width: 36px;
                height: 36px;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title { font-size: 13px; max-width: 38vw; }
            .btn-action span { display: none; }
            .nav-side-btn { width: 36px; height: 36px; }
            .nav-prev { left: 8px; }
            .nav-next { right: 8px; }
            .bottom-bar { padding: 4px 8px; gap: 4px; bottom: 8px; }
            .ctrl-btn { width: 32px; height: 32px; }
            .page-badge { font-size: 11px; padding: 2px 8px; }
        }
    </style>
</head>

    <!-- Toast Notification -->

    <script>
        // --- Web Audio API: Realistic Paper Rustle / Flip Sound ---
        let audioCtx = null;
        let soundEnabled = true;

        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const bufferSize = Math.floor(audioCtx.sampleRate * 0.16); // 160ms
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(900, audioCtx.currentTime);
                filter.Q.setValueAtTime(2.0, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(3600, audioCtx.currentTime + 0.10);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                console.warn('Audio error:', e);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        $(document).ready(function() {
            const totalPages = 10;
            const $flipbook = $('#flipbook');
            const $wrapper = $('#flipbook-wrapper');
            const pageLabel = document.getElementById('pageLabel');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const navPrev = document.getElementById('navPrev');
            const navNext = document.getElementById('navNext');
            const btnSound = document.getElementById('btnSound');
            const btnAutoPlay = document.getElementById('btnAutoPlay');
            const btnFullscreen = document.getElementById('btnFullscreen');
            const btnThumb = document.getElementById('btnThumb');
            const thumbDrawer = document.getElementById('thumbDrawer');
            const btnShare = document.getElementById('btnShare');

            // Responsive sizing helper
            function calculateDimensions() {
                const maxW = Math.min(window.innerWidth - 32, 1280);
                const maxH = window.innerHeight - 130; // 54 header + 56 dock + padding
                let w = maxW;
                let h = w * (9 / 16);
                if (h > maxH) {
                    h = maxH;
                    w = h * (16 / 9);
                }
                return { width: Math.round(w), height: Math.round(h) };
            }

            const initialDim = calculateDimensions();

            // Initialize Turn.js in Single Display Mode (16:9 Landscape Picture Book)
            $flipbook.turn({
                width: initialDim.width,
                height: initialDim.height,
                autoCenter: true,
                display: 'single',
                acceleration: true,
                duration: 750,
                elevation: 50,
                gradients: true,
                when: {
                    turning: function(event, page, view) {
                        playFlipSound();
                    },
                    turned: function(event, page, view) {
                        updateNavigation(page);
                    }
                }
            });

            $wrapper.css({
                width: initialDim.width + 'px',
                height: initialDim.height + 'px'
            });

            // Handle window resizing
            $(window).on('resize', function() {
                const dim = calculateDimensions();
                $flipbook.turn('size', dim.width, dim.height);
                $wrapper.css({
                    width: dim.width + 'px',
                    height: dim.height + 'px'
                });
            });

            // Update UI State based on current page
            function updateNavigation(page) {
                pageLabel.textContent = `Trang ${page} / ${totalPages}`;

                // Prev buttons state
                if (page <= 1) {
                    $(btnPrev).addClass('disabled');
                    $(navPrev).addClass('disabled');
                } else {
                    $(btnPrev).removeClass('disabled');
                    $(navPrev).removeClass('disabled');
                }

                // Next buttons state
                if (page >= totalPages) {
                    $(btnNext).addClass('disabled');
                    $(navNext).addClass('disabled');
                } else {
                    $(btnNext).removeClass('disabled');
                    $(navNext).removeClass('disabled');
                }

                // Thumbnails active state
                $('.thumb-item').each(function(i) {
                    $(this).toggleClass('active', (i + 1) === page);
                });
            }

            // Navigation Actions
            const goPrev = () => $flipbook.turn('previous');
            const goNext = () => $flipbook.turn('next');

            $(btnPrev).on('click', goPrev);
            $(navPrev).on('click', goPrev);
            $(btnNext).on('click', goNext);
            $(navNext).on('click', goNext);

            // Keyboard navigation
            $(window).on('keydown', function(e) {
                if (e.key === 'ArrowLeft') goPrev();
                if (e.key === 'ArrowRight' || e.key === ' ') goNext();
            });

            // Build Thumbnails Drawer
            for (let i = 1; i <= totalPages; i++) {
                const pad = String(i).padStart(2, '0');
                const $item = $(`
                    <div class="thumb-item ${i === 1 ? 'active' : ''}" data-page="${i}">
                        <img src="page-${pad}.jpg" alt="Trang ${i}">
                        <span class="thumb-label">${i}</span>
                    </div>
                `);
                $item.on('click', function() {
                    $flipbook.turn('page', i);
                    $(thumbDrawer).removeClass('show');
                });
                $(thumbDrawer).append($item);
            }

            // Thumbnail drawer toggle
            $(btnThumb).on('click', function(e) {
                e.stopPropagation();
                $(thumbDrawer).toggleClass('show');
            });

            $(document).on('click', function(e) {
                if (!$(thumbDrawer).is(e.target) && $(thumbDrawer).has(e.target).length === 0 && !$(btnThumb).is(e.target) && $(btnThumb).has(e.target).length === 0) {
                    $(thumbDrawer).removeClass('show');
                }
            });

            // Sound Toggle
            $(btnSound).on('click', function() {
                soundEnabled = !soundEnabled;
                $(btnSound).toggleClass('active', soundEnabled);
                $(btnSound).css('opacity', soundEnabled ? '1' : '0.4');
                if (soundEnabled) {
                    playFlipSound();
                    showToast('Đã bật âm thanh lật sách');
                } else {
                    showToast('Đã tắt âm thanh');
                }
            });

            // Auto Play
            let autoTimer = null;
            $(btnAutoPlay).on('click', function() {
                if (autoTimer) {
                    clearInterval(autoTimer);
                    autoTimer = null;
                    $(btnAutoPlay).removeClass('active');
                    showToast('Đã dừng tự động đọc');
                } else {
                    $(btnAutoPlay).addClass('active');
                    showToast('Đang tự động đọc (6s/trang)');
                    autoTimer = setInterval(function() {
                        const cur = $flipbook.turn('page');
                        if (cur >= totalPages) {
                            $flipbook.turn('page', 1);
                        } else {
                            $flipbook.turn('next');
                        }
                    }, 6000);
                }
            });

            // Fullscreen Toggle
            $(btnFullscreen).on('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });

            // Share Link
            $(btnShare).on('click', function() {
                const url = window.location.href;
                if (navigator.share) {
                    navigator.share({
                        title: 'Sách Lật 3D: Cậu Bé Tích Chu',
                        text: 'Mời bạn cùng bé xem sách tranh 3D lật trang Cậu Bé Tích Chu tuyệt đẹp!',
                        url: url
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(url).then(() => {
                        showToast('Đã sao chép liên kết vào bộ nhớ tạm!');
                    });
                }
            });

            
            // Rotate hint dismiss
            $('#closeRotateHint').on('click', function(e) {
                e.stopPropagation();
                $('#rotateHint').fadeOut(200);
            });

            // Initial UI Setup
            updateNavigation(1);
        });
    </script>
</body>
</html>
